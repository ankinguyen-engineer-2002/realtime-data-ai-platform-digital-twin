---
# Phase 2 — install Docker engine + compose plugin
- name: Install Docker
  hosts: hosts
  become: true
  tasks:
    - name: Ensure curl
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable + start docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Allow ubuntu user to use docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
